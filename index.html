<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>내 차 도우미</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f4f6f9">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="내 차 도우미">
<meta name="mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap">
<style>
/* Layout: clean light app. Cool gray page, borderless white cards with a soft shadow, filled color icons. Home shows four task tiles, a search and shortcuts; each task opens its own step-by-step screen. */
:root {
  color-scheme: light;
  --page: #f4f6f9;
  --bg: #ffffff;
  --surface: #eef1f5;
  --ink: #111827;
  --muted: #6b7280;
  --line: #e5e8ee;
  --shadow: 0 4px 20px rgba(0, 0, 0, .04);
  --accent: #0a2350;
  --on-accent: #ffffff;
  --link: #0a4a9a;
  --sky: #0089ad;
  --sky-soft: #e2f5fa;
  --hero: #0a2350;
  --hero2: #0d3a7a;
  --glass: #0c1626;
  --stop: #b42318; --stop-soft: #fbe2df;
  --soon: #8a5200; --soon-soft: #fdeccc;
  --ok: #1b7a4b; --ok-soft: #def3e7;
  --lamp-red: #ff5a50; --lamp-amber: #ffb020; --lamp-green: #3ddc84;
  --kakao: #fee500; --on-kakao: #191600;
  --font: "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; scroll-padding-top: 76px; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 16px; line-height: 1.65; word-break: keep-all; overflow-wrap: break-word; -webkit-text-size-adjust: 100%; }
h1, h2, h3, p, ul, ol, dl, dd { margin: 0; padding: 0; }
ul, ol { list-style: none; }
h1, h2, h3 { line-height: 1.3; letter-spacing: -.02em; text-wrap: balance; }
button, input, select { font-family: inherit; font-size: inherit; }
button { cursor: pointer; }
a { color: var(--link); }
:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
.in { max-width: 1040px; margin: 0 auto; padding: 0 16px; }
.eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; color: var(--sky); }
.num { font-variant-numeric: tabular-nums; }

.hd { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
.hd .in { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand b { font-size: 17px; font-weight: 800; white-space: nowrap; }
.brand span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.nav { display: flex; gap: 2px; }
.nav a { display: flex; align-items: center; min-height: 44px; padding: 0 12px; font-size: 14.5px; font-weight: 500; color: var(--muted); text-decoration: none; border-radius: 8px; }
.nav a[aria-current="true"] { color: var(--ink); font-weight: 700; background: var(--surface); }

.hero { background: linear-gradient(155deg, var(--hero), var(--hero2)); color: #fff; }
.hero .in { padding-top: 36px; padding-bottom: 28px; }
.hero .eyebrow { color: #9fe3ff; }
.hero h1 { font-size: clamp(26px, 4.6vw, 40px); font-weight: 800; margin-top: 10px; max-width: 20em; }
.hero p.lede { margin-top: 12px; max-width: 46ch; color: rgba(255,255,255,.86); }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin-top: 26px; }
.tile { display: grid; gap: 4px; align-content: start; text-align: left; min-height: 132px; padding: 16px; border-radius: 16px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.08); color: #fff; text-decoration: none; }
.tile:hover { background: rgba(255,255,255,.14); }
.tile i { width: 42px; height: 42px; border-radius: 50%; display: grid; place-items: center; background: var(--glass); margin-bottom: 6px; }
.tile i svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.tile b { font-size: 18px; font-weight: 700; }
.tile small { font-size: 14px; color: rgba(255,255,255,.78); line-height: 1.45; }
.c-amber { color: var(--lamp-amber); } .c-red { color: var(--lamp-red); } .c-green { color: var(--lamp-green); } .c-sky { color: #7fdcf5; }

.sec { padding: 44px 0 0; }
.sec:last-of-type { padding-bottom: 44px; }
.sec h2 { font-size: clamp(22px, 3vw, 28px); font-weight: 800; margin-top: 6px; }
.sec .lead { margin-top: 8px; color: var(--muted); max-width: 60ch; }
.card { border: 1px solid var(--line); border-radius: 16px; background: var(--bg); padding: 18px; }
.note { font-size: 13.5px; color: var(--muted); margin-top: 12px; }

/* 경고등 */
.tools { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; align-items: center; }
.search { flex: 1 1 240px; min-height: 48px; padding: 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--ink); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-size: 14.5px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--dot, transparent); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 700; }
.lampwrap { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 20px; margin-top: 18px; align-items: start; }
.lamps { display: grid; grid-template-columns: repeat(auto-fill, minmax(128px, 1fr)); gap: 10px; }
.lamp { display: grid; grid-template-rows: auto 1fr; padding: 0; overflow: hidden; text-align: left; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); }
.lamp .gl { height: 76px; display: grid; place-items: center; background: var(--glass); }
.lamp svg, .dh svg { width: 44px; height: 44px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.lamp .nm { padding: 10px 12px; font-size: 14px; font-weight: 700; line-height: 1.4; }
.lamp[aria-pressed="true"] { border-color: var(--sky); box-shadow: 0 0 0 2px var(--sky); }
.detail { position: sticky; top: 76px; }
.dh { display: flex; gap: 14px; align-items: center; }
.dh .gl { flex: none; width: 68px; height: 68px; border-radius: 14px; display: grid; place-items: center; background: var(--glass); }
.dh h3 { font-size: 19px; font-weight: 800; }
.badge { display: inline-block; margin-top: 4px; padding: 2px 10px; border-radius: 8px; font-size: 13.5px; font-weight: 700; }
.lv-stop { color: var(--stop); background: var(--stop-soft); } .lv-soon { color: var(--soon); background: var(--soon-soft); } .lv-ok { color: var(--ok); background: var(--ok-soft); } .lv-info { color: var(--link); background: var(--sky-soft); }
.detail h4 { margin: 16px 0 6px; font-size: 14px; color: var(--muted); }
.detail ol { counter-reset: s; display: grid; gap: 8px; }
.detail ol li { counter-increment: s; display: grid; grid-template-columns: 26px 1fr; gap: 8px; }
.detail ol li::before { content: counter(s); width: 24px; height: 24px; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); display: grid; place-items: center; font-size: 13px; font-weight: 700; margin-top: 2px; }
.acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 16px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 999px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); font-weight: 700; font-size: 15px; text-decoration: none; }
.btn.p { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.k { background: var(--kakao); border-color: var(--kakao); color: var(--on-kakao); }
.btn.w { background: #fff; border-color: #fff; color: #0a2350; }
.btn.o { background: transparent; border-color: rgba(255,255,255,.5); color: #fff; }

/* 사고·긴급 */
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 20px; margin-top: 20px; align-items: start; }
.steps { display: grid; gap: 8px; }
.steps label { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); cursor: pointer; }
.steps input { width: 22px; height: 22px; margin-top: 3px; accent-color: var(--sky); }
.steps b { display: block; }
.steps span { font-size: 14.5px; color: var(--muted); }
.steps label:has(input:checked) { background: var(--surface); }
.steps label:has(input:checked) b { text-decoration: line-through; color: var(--muted); }
.calls { display: grid; gap: 8px; }
.call { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; padding: 12px 14px; border: 1px solid var(--line); border-radius: 12px; }
.call.main { border-color: var(--stop); background: var(--stop-soft); }
.call b { display: block; }
.call span { font-size: 14px; color: var(--muted); }
.call a { font-weight: 800; font-size: 18px; text-decoration: none; white-space: nowrap; }
.tblwrap { overflow-x: auto; margin-top: 10px; border: 1px solid var(--line); border-radius: 12px; }
table { width: 100%; border-collapse: collapse; font-size: 15px; }
th { text-align: left; font-size: 13px; color: var(--muted); padding: 10px 14px; background: var(--surface); }
td { padding: 10px 14px; border-top: 1px solid var(--line); }
td:last-child, th:last-child { text-align: right; }
td a { font-weight: 700; text-decoration: none; white-space: nowrap; }
h3.sub { font-size: 17px; font-weight: 700; margin: 22px 0 0; }

/* 주유·충전·세차 */
.links { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin-top: 20px; }
.lk { display: grid; gap: 4px; padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); text-decoration: none; }
.lk:hover { border-color: var(--sky); }
.lk b { font-size: 17px; }
.lk span { font-size: 14.5px; color: var(--muted); }
.lk em { font-style: normal; font-size: 14px; font-weight: 700; color: var(--link); margin-top: 6px; }
.tips { margin-top: 12px; display: grid; gap: 6px; padding-left: 20px; list-style: disc; color: var(--muted); font-size: 15px; }

/* 내 차 한 장 */
.fm { display: grid; gap: 12px; }
.fm label { display: grid; gap: 4px; font-size: 13.5px; font-weight: 700; color: var(--muted); }
.fm input, .fm select { min-height: 46px; padding: 8px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); width: 100%; }
.sum { background: linear-gradient(155deg, var(--hero), var(--hero2)); color: #fff; border: 0; }
.plate { display: inline-block; padding: 2px 12px; border: 2px solid #fff; border-radius: 8px; font-weight: 800; font-size: 20px; letter-spacing: .04em; }
.sum dl { display: grid; grid-template-columns: auto 1fr; gap: 8px 16px; margin-top: 14px; font-size: 15px; }
.sum dt { color: rgba(255,255,255,.72); }
.sum dd { font-weight: 700; text-align: right; }
.dday { margin-top: 14px; padding: 10px 14px; border-radius: 10px; background: rgba(255,255,255,.12); font-size: 14.5px; }
.msg { font-size: 14px; color: var(--muted); min-height: 1.6em; }

.desk { margin-top: 44px; background: linear-gradient(155deg, var(--hero), var(--hero2)); color: #fff; }
.desk .in { padding-top: 36px; padding-bottom: 36px; display: flex; flex-wrap: wrap; gap: 20px; align-items: center; justify-content: space-between; }
.desk h2 { font-size: 22px; font-weight: 800; }
.desk p { color: rgba(255,255,255,.85); margin-top: 6px; max-width: 46ch; }
.foot { padding: 22px 0 40px; font-size: 13px; color: var(--muted); }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #111; color: #fff; padding: 10px 16px; border-radius: 99px; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s; max-width: calc(100% - 32px); z-index: 40; }
.toast.on { opacity: 1; }

/* 단계별 화면 */
.view { max-width: 720px; margin: 0 auto; padding: 14px 16px 44px; }
.stepbar { display: flex; align-items: center; justify-content: space-between; min-height: 44px; }
.back { display: inline-flex; align-items: center; min-height: 44px; padding-right: 12px; font-weight: 700; color: var(--muted); text-decoration: none; }
.prog { font-size: 14px; font-weight: 700; color: var(--sky); }
.bar { height: 6px; border-radius: 6px; background: var(--surface); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sky); border-radius: 6px; }
.q { font-size: 23px; font-weight: 800; letter-spacing: -.02em; line-height: 1.35; margin-top: 20px; }
.pg { font-size: 25px; font-weight: 800; margin-top: 8px; }
.qs { color: var(--muted); margin-top: 4px; }
.choices { display: grid; gap: 10px; margin-top: 18px; }
.choice { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 68px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); text-align: left; text-decoration: none; }
.choice:hover, .cbtn:hover, .lamp:hover { border-color: var(--sky); }
.choice i { flex: none; width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: var(--sky-soft); color: var(--link); }
.choice.red i { background: var(--stop-soft); color: var(--stop); }
.choice i svg, .short i svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.choice span { flex: 1; min-width: 0; }
.choice b { display: block; font-size: 17px; }
.choice small { display: block; font-size: 14px; color: var(--muted); }
.choice::after { content: ""; flex: none; width: 8px; height: 8px; border: solid var(--muted); border-width: 2px 2px 0 0; transform: rotate(45deg); }
.choice[aria-pressed="true"] { border-color: var(--sky); background: var(--sky-soft); }
.colors { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 18px; }
.cbtn { display: grid; justify-items: center; gap: 6px; min-height: 108px; padding: 14px 8px; border: 1px solid var(--line); border-radius: 14px; background: var(--bg); color: var(--ink); font-weight: 700; }
.cbtn i { width: 34px; height: 34px; border-radius: 50%; }
.cbtn small { font-size: 13.5px; font-weight: 500; color: var(--muted); }
.view .lamps { margin-top: 18px; }
a.lamp { text-decoration: none; }
.view .detail { position: static; margin-top: 12px; }
.detail h1 { font-size: 20px; font-weight: 800; }
.btn.wide { width: 100%; margin-top: 14px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
h2.sub { font-size: 17px; font-weight: 700; margin: 24px 0 10px; }
.fold { margin-top: 12px; border: 1px solid var(--line); border-radius: 12px; padding: 0 14px 12px; }
.fold summary { display: flex; align-items: center; justify-content: space-between; min-height: 50px; font-weight: 700; cursor: pointer; list-style: none; }
.fold summary::-webkit-details-marker { display: none; }
.fold summary::after { content: "펼치기"; font-size: 14px; color: var(--link); }
.fold[open] summary::after { content: "접기"; }
.view .steps { margin-top: 14px; }
.home2 { padding-top: 26px; padding-bottom: 8px; max-width: 760px; }
.flbl { display: block; font-weight: 700; margin-bottom: 8px; }
.home2 .search { width: 100%; min-height: 54px; }
.fr { margin-top: 8px; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.fr a { display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 12px; color: var(--ink); text-decoration: none; border-top: 1px solid var(--line); }
.fr a:first-child { border-top: 0; }
.fr .gl { flex: none; width: 40px; height: 40px; border-radius: 10px; display: grid; place-items: center; background: var(--glass); }
.fr .gl svg { width: 28px; height: 28px; fill: none; stroke: currentColor; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
.fr span { flex: 1; min-width: 0; font-weight: 600; }
.fr em { font-style: normal; margin: 0; white-space: nowrap; }
.fr p { padding: 12px; color: var(--muted); font-size: 14.5px; }
.pop { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.pop a { display: inline-flex; align-items: center; min-height: 42px; padding: 0 14px; border: 1px solid var(--line); border-radius: 999px; color: var(--muted); font-size: 14.5px; font-weight: 500; text-decoration: none; }
.short { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--line); }
.short a { display: grid; justify-items: center; gap: 8px; padding: 6px 2px; color: var(--ink); font-size: 14.5px; font-weight: 600; text-align: center; text-decoration: none; line-height: 1.35; }
.short i { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; background: var(--surface); border: 1px solid var(--line); color: var(--link); }
.desk { margin-top: 32px; }

/* 클린 라이트: 테두리 대신 부드러운 그림자 */
body { background: var(--page); }
.hd { border-bottom: 0; box-shadow: 0 1px 0 rgba(17, 24, 39, .05); }
.card, .choice, .cbtn, .lamp, .call, .fold, .lk, .steps label, .tblwrap, .fr, .search, .pop a, .short i, .btn { border-color: transparent; box-shadow: var(--shadow); }
.pop a, .short i, .search { background: var(--bg); }
.fold { background: var(--bg); }
.hero { background: transparent; color: var(--ink); }
.hero .in { padding-top: 28px; padding-bottom: 8px; }
.hero h1 { font-size: clamp(28px, 4.4vw, 36px); margin-top: 0; }
.hero p.lede { margin-top: 6px; color: var(--muted); }
.tiles { margin-top: 20px; }
.tile { position: relative; gap: 2px; min-height: 150px; padding: 18px; border: 0; border-radius: 20px; background: var(--bg); color: var(--ink); box-shadow: var(--shadow); transition: transform .12s, box-shadow .12s; }
.tile:hover { background: var(--bg); box-shadow: 0 8px 26px rgba(0, 0, 0, .08); transform: translateY(-1px); }
.tile:active { transform: scale(.985); }
.tile i { width: 56px; height: 56px; border-radius: 0; background: none; margin-bottom: 16px; }
.tile i svg { width: 56px; height: 56px; stroke: none; fill: initial; }
.tile b { font-size: 18px; line-height: 1.35; }
.tile small { color: var(--muted); }
.tile::after { content: ""; position: absolute; top: 22px; right: 20px; width: 9px; height: 9px; border: solid #c3c9d3; border-width: 2px 2px 0 0; transform: rotate(45deg); }
.tile { min-width: 0; }
.tile i.logos { width: auto; height: 56px; display: grid; align-content: center; justify-items: start; gap: 5px; font-style: normal; }
.tile i.logos span { display: block; line-height: 1; white-space: nowrap; }
.wm-h { font-size: 19px; font-weight: 800; letter-spacing: .14em; color: #002c5f; }
.wm-g { font-size: 15px; font-weight: 500; letter-spacing: .32em; color: #111827; padding-left: 1px; }
.home2 { padding-top: 22px; }
.short { border-top: 0; padding-top: 4px; }
.desk { background: transparent; color: var(--ink); }
.desk .in { max-width: 728px; margin: 0 auto; padding: 0 16px 8px; display: block; }
.desk .box { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: space-between; padding: 22px; border-radius: 20px; background: var(--bg); box-shadow: var(--shadow); }
.desk h2 { font-size: 19px; }
.desk p { color: var(--muted); font-size: 15px; }
.desk .btn.o { background: var(--surface); border-color: transparent; color: var(--ink); box-shadow: none; }
.foot { max-width: 728px; margin: 0 auto; }

/* 주변 목록 */
.nb { margin-top: 16px; display: grid; gap: 12px; }
.nb h2 { font-size: 18px; font-weight: 800; }
.pchips { display: flex; flex-wrap: wrap; gap: 6px; }
.pchip { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 0; background: var(--surface); color: var(--muted); font-weight: 600; font-size: 14.5px; }
.pchip[aria-pressed="true"] { background: var(--ink); color: #fff; }
.wait { color: var(--muted); }
.err { color: var(--stop); font-weight: 600; }
.stations, .days { display: grid; gap: 8px; }
.station { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; align-items: center; padding: 12px 14px; border-radius: 12px; background: var(--page); color: var(--ink); text-decoration: none; }
.station.top { background: var(--ok-soft); }
.station b { font-size: 15.5px; }
.station .pr { font-weight: 800; font-size: 17px; text-align: right; }
.station span { font-size: 14px; color: var(--muted); }
.station .gk { color: var(--link); font-weight: 700; text-align: right; }

    fetch("api/evstat?ids=" + it.map(function (s) { return encodeURIComponent(s.i); }).join(",")).then(function (r) { return r.ok ? r.json() : {}; }).catch(function () { return {}; }).then(function (d) {
      var stt = (d && d.st) || {};
      it.forEach(function (s) { near.evStat[s.i] = stt[s.i] || null; });
      redrawNear();
    });
  }
  function loadEv() {
    near.busy = "ev"; near.evErr = ""; redrawNear();
    evReady().then(getLoc).then(evNear).then(function (list) { near.ev = list; near.busy = ""; redrawNear(); loadEvStat(); }, function (e) { near.evErr = typeof e === "string" ? e : "충전소 목록을 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요."; near.busy = ""; redrawNear(); });
  }
  function vNearby() {
    return wrap(head(0, 0, "") + '<h1 class="pg">주유·충전·세차</h1><p class="qs">무엇을 찾으세요? 내 위치 근처를 이 화면에서 바로 보여 드립니다.</p><div class="choices">' +
      choice('href="#gas"', "pump", "주유소 최저가", "반경 5km · 싼 순서") +
      choice('href="#charge"', "bolt", "전기차 충전소", "가까운 순서 · 지금 빈 충전기") +
      choice('href="#wash"', "sun", "세차하기 좋은 날", "오늘부터 4일 날씨") + "</div>");
  }
  /* ---- 소모품 교환 주기 (자동차365 정비 주기 안내 기준) ---- */
  var PARTS = [
    ["5,000~10,000km마다", "자주 갈아요", [["엔진오일 · 오일필터", "5,000~10,000km", "주행 습관과 차종에 따라 다릅니다. 짧은 거리를 자주 다니면 앞쪽 주기로."], ["공기 · 에어컨 필터", "10,000km", "에어컨 냄새가 나거나 바람이 약하면 더 일찍."], ["타이어 위치 교환", "10,000km", "앞뒤를 바꿔 고르게 닳게 합니다."]]],
    ["20,000km마다", "", [["연료필터", "20,000km", ""], ["휠 얼라이먼트", "20,000km마다 조정", "핸들이 한쪽으로 쏠리면 바로 점검."]]],
    ["40,000km마다", "", [["변속기 오일", "40,000km", ""], ["브레이크 오일", "40,000km", ""], ["점화플러그", "40,000km", ""], ["하이텐션 코드", "40,000km", ""], ["구동벨트", "40,000km", ""], ["브레이크 패드 · 디스크", "40,000km", "끽 소리가 나면 주행거리와 상관없이 점검."], ["냉각수 · 부동액", "40,000km", ""]]],
    ["기간 · 상태를 보고", "", [["배터리", "2~3년", "시동이 약하게 걸리면 미리 점검."], ["타이어", "마모 상태 보고 교환", "홈 깊이가 1.6mm 이하면 교체 대상입니다."]]]
  ];
  function vParts() {
    return wrap(head(0, 0, "") + '<h1 class="pg">소모품 교환 주기</h1><p class="qs">부품별로 언제 갈아야 하는지 한눈에 봅니다. 차종과 모델마다 다를 수 있으니 차량 취급설명서를 먼저 확인하세요.</p>' +
      PARTS.map(function (g) {
        return '<section class="pgrp"><h2>' + g[0] + "</h2>" + '<div class="plist">' + g[2].map(function (r) {
          return '<div class="prow"><div><b>' + r[0] + "</b>" + (r[2] ? "<span>" + r[2] + "</span>" : "") + '</div><em class="num">' + r[1] + "</em></div>";
        }).join("") + "</div></section>";
      }).join("") +
      '<p class="note">출처: 자동차365 자동차 정비 주기 안내(국토교통부·한국교통안전공단). 상세 주기는 제조사·모델에 따라 다릅니다.</p>' +
      '<h2 class="sub">정비소 찾기</h2><div class="links"><a class="lk" href="' + NMAP + encodeURIComponent("블루핸즈") + '" target="_blank" rel="noopener"><b>블루핸즈 정비</b><span>현대자동차 공식 서비스 협력점</span><em>지도에서 찾기 →</em></a></div>');
  }
  function vGas() { return wrap(head(0, 0, "nearby") + '<div id="nearFuel">' + fuelBox() + "</div>"); }
  function vCharge() { return wrap(head(0, 0, "nearby") + '<div id="nearEv">' + evBox() + "</div>"); }
  function vWash() { return wrap(head(0, 0, "nearby") + '<div id="nearWx">' + wxBox() + "</div>"); }
  function redrawNear() { var f = $("nearFuel"), v = $("nearEv"), w = $("nearWx"); if (f) f.innerHTML = fuelBox(); if (v) v.innerHTML = evBox(); if (w) w.innerHTML = wxBox(); }
  function loadFuel() {
    near.fuelErr = "";
    var c = lsGet("carhelp_fuel");
    if (!(near.fuel && near.fuel.prod === near.prod) && c && c.d && c.d.prod === near.prod && Date.now() - c.t < 6 * 3600e3) { near.fuel = c.d; near.fuelAt = c.t; }
    var shown = near.fuel && near.fuel.prod === near.prod;
    if (shown) near.refresh = "fuel"; else near.busy = "fuel";
    redrawNear();
    getLoc().then(function (loc) {
      return fetch("api/fuel?lat=" + loc.lat + "&lon=" + loc.lon + "&prod=" + near.prod).then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) { if (!r.ok || !d.items) throw new Error(d.error || "가격을 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요."); return d; });
      });
    }).then(function (d) { near.fuel = d; near.fuelAt = 0; lsSet("carhelp_fuel", { t: Date.now(), d: d }); },
      function (e) { var m = typeof e === "string" ? e : (e && e.message) || "가격을 불러오지 못했습니다."; if (shown) toast("최신 가격을 받지 못해 지난 목록을 보여 드립니다."); else near.fuelErr = m; })
      .then(function () { near.busy = ""; near.refresh = ""; redrawNear(); });
  }
  function loadWx() {
    near.wxErr = "";
    var c = lsGet("carhelp_wx");
    if (!near.wx && c && c.d && Date.now() - c.t < 3 * 3600e3) near.wx = c.d;
    var shown = !!near.wx;
    if (shown && c && Date.now() - c.t < 30 * 60000) { redrawNear(); return; }
    if (shown) near.refresh = "wx"; else near.busy = "wx";
    redrawNear();
    getLoc().then(function (loc) {
      var q = "latitude=" + loc.lat + "&longitude=" + loc.lon + "&timezone=Asia%2FSeoul&forecast_days=4&daily=weather_code,precipitation_probability_max,precipitation_sum,temperature_2m_min,temperature_2m_max";
      return fetch("https://api.open-meteo.com/v1/forecast?" + q).then(function (r) { if (!r.ok) throw new Error("날씨를 불러오지 못했습니다."); return r.json(); });
    }).then(function (w) {
      var D = w.daily;
      near.wx = D.time.map(function (t, i) { return { date: t, code: D.weather_code[i], pop: D.precipitation_probability_max[i] || 0, sum: D.precipitation_sum[i] || 0, tmin: D.temperature_2m_min[i], tmax: D.temperature_2m_max[i] }; });
      lsSet("carhelp_wx", { t: Date.now(), d: near.wx });
    }, function (e) { if (!shown) near.wxErr = typeof e === "string" ? e : "날씨를 불러오지 못했습니다. 잠시 뒤 다시 눌러 주세요."; })
      .then(function () { near.busy = ""; near.refresh = ""; redrawNear(); });
  }

  function dday(d) { if (!d) return null; var t = new Date(); t.setHours(0, 0, 0, 0); var x = new Date(d + "T00:00:00"); return isNaN(x) ? null : Math.round((x - t) / 864e5); }
  function sumHtml() {
    var ins = insOf(), d = dday(car.insp), empty = !car.plate && !car.model && !ins && !car.insp;
    var h = '<span class="plate">' + esc(car.plate || "12가 3456") + "</span>" + (empty ? '<p style="margin-top:8px;font-size:14px;color:rgba(255,255,255,.75)">예시 화면입니다. 아래에 적고 저장하면 내 정보로 바뀝니다.</p>' : "") +
      "<dl><dt>차종</dt><dd>" + esc(car.model || (empty ? "디 올 뉴 아반떼" : "미입력")) + "</dd><dt>사고접수</dt><dd>" + (ins ? esc(ins[0]) + " " + ins[1] : (empty ? "현대해상 1588-5656" : "미입력")) + "</dd><dt>정기검사 만료</dt><dd>" + (car.insp ? esc(car.insp.replace(/-/g, ".")) : "미입력") + "</dd><dt>긴급출동</dt><dd>현대 080-600-6000</dd></dl>";
    if (d !== null) h += '<p class="dday">' + (d < 0 ? "정기검사 만료일이 " + (-d) + "일 지났습니다. 한국교통안전공단에서 검사 일정을 확인하세요." : d === 0 ? "오늘이 정기검사 만료일입니다." : "정기검사 만료일까지 " + d + "일 남았습니다.") + "</p>";
    return h + '<div class="acts">' + (ins ? '<a class="btn w" href="' + tel(ins[1]) + '">' + esc(ins[0]) + " 전화</a>" : "") + '<button type="button" class="btn o" id="copyCar">카드 내용 복사</button></div>';
  }
  function vMyCar() {
    return wrap(head(0, 0, "") + '<h1 class="pg">내 차 한 장</h1><p class="qs">급할 때 찾지 않도록 미리 적어 두세요. 이 기기의 브라우저에만 저장됩니다.</p>' +
      '<div class="card sum" id="carSum" aria-live="polite" style="margin-top:16px">' + sumHtml() + "</div>" +
      '<details class="fold"' + (car.plate || car.ins ? "" : " open") + '><summary>내 차 정보 적기</summary><form class="fm" id="carForm" novalidate style="margin-top:12px">' +
      '<label for="f-plate">차량번호<input id="f-plate" maxlength="12" autocomplete="off" placeholder="예) 12가 3456" value="' + esc(car.plate || "") + '"></label>' +
      '<label for="f-model">차종<input id="f-model" maxlength="24" autocomplete="off" placeholder="예) 디 올 뉴 아반떼" value="' + esc(car.model || "") + '"></label>' +
      '<label for="f-ins">사고접수할 보험사<select id="f-ins"><option value="">고르세요</option>' + INS.map(function (r) { return '<option value="' + r[0] + '"' + (car.ins === r[0] ? " selected" : "") + ">" + r[0] + "</option>"; }).join("") + "</select></label>" +
      '<label for="f-insp">정기검사 만료일<input id="f-insp" type="date" value="' + esc(car.insp || "") + '"></label>' +
      '<div class="acts" style="margin-top:4px"><button class="btn p" type="submit">저장하기</button><button class="btn" type="button" id="carClear">지우기</button></div><p class="msg" id="carMsg" role="status"></p></form></details>');
  }
  function lampText(id) { var l = lampOf(id), lv = LEVEL[l.level]; return "[" + l.name + " 경고등] " + lv[0] + "\n뜻: " + l.what + "\n할 일: " + l.todo.map(function (t, i) { return (i + 1) + ") " + t; }).join(" "); }
  function carText() { var ins = insOf(); return "[내 차 한 장] " + (car.plate || "") + "\n차종: " + (car.model || "-") + "\n사고접수: " + (ins ? ins[0] + " " + ins[1] : "-") + "\n정기검사 만료: " + (car.insp || "-") + "\n현대 긴급출동 080-600-6000 · 고속도로 긴급견인 1588-2504"; }
  function copy(text, msg) {
    try { navigator.clipboard.writeText(text).then(function () { toast(msg); }, function () { toast("복사가 안 되는 화면입니다. 직접 선택해 복사해 주세요."); }); }
    catch (e) { toast("복사가 안 되는 화면입니다. 직접 선택해 복사해 주세요."); }
  }

  var ROUTES = { fueltype: vFuelType, color: vColor, shape: vShape, sos: vSos, crash: vCrash, "crash-steps": vCrashSteps, stop: vStop, "stop-steps": vStopSteps, nearby: vNearby, gas: vGas, charge: vCharge, wash: vWash, parts: vParts };
  function route() { return (location.hash || "").slice(1); }
  function render() {
    var r = route(), home = false, h;
    if (r.indexOf("lamp-") === 0) h = vLamp(r.slice(5));
    else if (r === "crash-steps" && st.hurt === null) h = vCrash();
    else if (r === "stop-steps" && st.road === null) h = vStop();
    else if (ROUTES[r]) h = ROUTES[r]();
    else { h = vHome(); home = true; }
    if (h.indexOf('<section class="hero"') === 0) home = true;
    $("app").innerHTML = h;
    if (r === "gas" && !near.busy && !near.refresh && !near.fuelErr && !(near.fuel && near.fuel.prod === near.prod && !near.fuelAt && near.fuelT && Date.now() - near.fuelT < 10 * 60000)) { loadFuel(); near.fuelT = Date.now(); }
    if (r === "nearby") warmLoc();
    if (r === "charge" && !near.busy && !near.ev && !near.evErr) loadEv();
    if (r === "wash" && !near.busy && !near.refresh && !near.wxErr) loadWx();
    $("desk").hidden = !home;
    var as = document.querySelectorAll(".nav a");
    for (var i = 0; i < as.length; i++) as[i].setAttribute("aria-current", String(as[i].getAttribute("data-m") === (r.indexOf("lamp-") === 0 || r === "color" || r === "shape" ? "fueltype" : r.replace(/-steps$/, "").replace(/^(crash|stop)$/, "sos").replace(/^(gas|charge|wash)$/, "nearby"))));
  }
  function go(v) { if (route() === v) { render(); window.scrollTo(0, 0); } else location.hash = v; }
  window.addEventListener("hashchange", function () { render(); window.scrollTo(0, 0); });

  document.addEventListener("click", function (e) {
    var t = e.target, x;
    if (!t.closest) return;
    if ((x = t.closest("[data-fuel]"))) { st.fuel = x.getAttribute("data-fuel"); go("color"); return; }
    if ((x = t.closest("[data-color]"))) { st.color = x.getAttribute("data-color"); st.all = false; go("shape"); return; }
    if ((x = t.closest("[data-hurt]"))) { st.hurt = x.getAttribute("data-hurt") === "1"; go("crash-steps"); return; }
    if ((x = t.closest("[data-road]"))) { st.road = x.getAttribute("data-road"); go("stop-steps"); return; }
    if (t.id === "allShapes") { st.all = true; render(); return; }
    if (t.id === "goFuel") { loadFuel(); return; }
    if (t.id === "goWx") { loadWx(); return; }
    if (t.id === "goEv") { loadEv(); return; }
    if (t.id === "goInstall") {
      if (!deferredPrompt) return;
      var p = deferredPrompt; deferredPrompt = null;
      p.prompt(); p.userChoice.then(function () { paintInstall(); }).catch(function () { paintInstall(); });
      return;
    }
    if ((x = t.closest("[data-evf]"))) { near.evFast = x.getAttribute("data-evf") === "1"; redrawNear(); loadEvStat(); return; }
    if ((x = t.closest("[data-prod]"))) { near.prod = x.getAttribute("data-prod"); try { localStorage.setItem("carhelp_prod", near.prod); } catch (err) {} if (near.fuel) loadFuel(); else redrawNear(); return; }
    if (t.id === "copyLamp") { copy(lampText(t.getAttribute("data-id")), "경고등 내용을 복사했습니다."); return; }
    if (t.id === "copyCar") { copy(carText(), "카드 내용을 복사했습니다."); return; }
    if (t.id === "carClear") { car = {}; try { localStorage.removeItem(KEY); } catch (err) {} render(); toast("적은 내용을 지웠습니다."); return; }
  });
  document.addEventListener("submit", function (e) {
    if (e.target.id !== "carForm") return;
    e.preventDefault();
    car = { plate: $("f-plate").value.trim(), model: $("f-model").value.trim(), ins: $("f-ins").value, insp: $("f-insp").value };
    var ok = true; try { localStorage.setItem(KEY, JSON.stringify(car)); } catch (err) { ok = false; }
    $("carSum").innerHTML = sumHtml();
    $("carMsg").textContent = ok ? "저장했습니다. 이 기기의 브라우저에만 보관됩니다." : "이 화면에서는 저장할 수 없습니다. 창을 닫으면 내용이 사라집니다.";
  });
  document.addEventListener("input", function (e) {
    if (e.target.id !== "lampQ") return;
    var k = e.target.value.replace(/\s/g, "").toLowerCase(), box = $("findr");
    if (!k) { box.innerHTML = ""; return; }
    var list = LAMPS.filter(function (l) { return (l.name + l.what).replace(/\s/g, "").toLowerCase().indexOf(k) >= 0; }).slice(0, 5);
    box.innerHTML = '<div class="fr">' + (list.length ? list.map(function (l) { return '<a href="#lamp-' + l.id + '"><span class="gl">' + svg(l) + "</span><span>" + esc(l.name) + ' 경고등</span><em class="badge lv-' + l.level + '">' + LEVEL[l.level][0] + "</em></a>"; }).join("") : "<p>찾는 불이 없습니다. 위의 경고등 뜻에서 색으로 찾아보세요.</p>") + "</div>";
  });
  render();
})();
</script>
</body>
</html>
