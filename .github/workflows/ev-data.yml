yaml
name: 전기차 충전소 목록 갱신

on:
  schedule:
    - cron: "17 18 * * *" # 매일 새벽 3시 17분(한국 시간)
  workflow_dispatch: {}   # Actions 탭에서 'Run workflow'로 바로 실행

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 충전소 목록 받기
        env:
          EV_KEY: ${{ secrets.EV_KEY }}
        run: node scripts/build-ev.mjs
      - name: 바뀐 것이 있으면 올리기
        run: |
          git config user.name "ev-data-bot"
          git config user.email "ev-data-bot@users.noreply.github.com"
          git add ev
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "전기차 충전소 목록 갱신 $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
